# Fake robot: pure Python, no network. Same limits as the CR5 so the GUI behaves the same.
name: Fake CR5
driver: fake
model: {urdf: ../assets/dobot_cr5/cr5_robot.urdf}
limits:
  speed_cap_pct: 100
  box_enabled: false  # switch on in the Robot view (Safety box)
  box_mm: {x: [-632, -332], y: [-286, 14], z: [334, 634]}
  joints_deg: [[-360, 360], [-360, 360], [-160, 160], [-360, 360], [-360, 360], [-360, 360]]
  max_tcp_speed_mm_s: 150
  max_step_deg: 2.0
  teleport_mm: 80
  stale_ms: 200
stream: {period_s: 0.03, aheadtime: 50, gain: 500}
gripper: {type: fake}
home_joints_deg: [0, 0, 90, 0, -90, 0]
home_confirmed: true  # nothing to hit on a fake robot
